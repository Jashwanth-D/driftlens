name: Drift Reconciliation (GitOps)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install groq pydantic

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init (AWS)
        working-directory: terraform/aws
        run: terraform init

      - name: Run drift detection
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'ai')
          from drift_detector import detect_s3_drift, detect_lambda_drift
          reports = [
              detect_s3_drift('psiddhi-jashwanth-site', 'terraform/aws'),
              detect_lambda_drift('psiddhi-jashwanth-hello', 'terraform/aws'),
          ]
          drift_count = sum(1 for r in reports if r.has_drift)
          for r in reports:
              print(f'--- {r.resource_type}: {r.resource_name} ---')
              print(f'Drift: {r.has_drift}')
              for d in r.diffs:
                  print(f'  - {d}')
              print(f'Narrative: {r.narrative}')
              print()
          print(f'::notice::Reconciliation complete. Drift detected in {drift_count} resource(s).')
          "
